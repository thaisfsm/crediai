services:
  # Opcional para quem escolher explicitamente rodar PostgreSQL local. Não é parte do fluxo padrão.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crediai
      POSTGRES_USER: crediai_owner
      POSTGRES_PASSWORD: ${CREDIAI_POSTGRES_OWNER_PASSWORD:?Defina CREDIAI_POSTGRES_OWNER_PASSWORD para usar o PostgreSQL local}
      POSTGRES_APP_PASSWORD: ${CREDIAI_POSTGRES_APP_PASSWORD:?Defina CREDIAI_POSTGRES_APP_PASSWORD para usar o PostgreSQL local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crediai-postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crediai_owner -d crediai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crediai-postgres:
